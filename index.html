<!DOCTYPE html>
<html>
<head>
    <title>Pac-Man</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
            color: white;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 2px solid #2121DE;
            image-rendering: pixelated;
        }
        #score {
            font-size: 20px;
            margin-bottom: 10px;
            text-align: left;
            width: 448px;
            display: flex;
            justify-content: space-between;
        }
        #gameOver, #winScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #FFD700;
            text-align: center;
            display: none;
        }
        button {
            background: #FFD700;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">
            <span>SCORE: <span id="scoreValue">0</span></span>
            <span>LIVES: <span id="livesValue">3</span></span>
        </div>
        <canvas id="gameCanvas" width="448" height="496"></canvas>
        <div id="gameOver">
            GAME OVER
            <br><button onclick="resetGame()">PLAY AGAIN</button>
        </div>
        <div id="winScreen">
            YOU WIN!
            <br><button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>
    <script src="src/game.js"></script>
</body>
</html>
