<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
}
canvas {
  border: 3px solid #2121DE;
  display: block;
}
#ui {
  color: #fff;
  font-size: 24px;
  margin-bottom: 10px;
  display: flex;
  gap: 40px;
}
#gameOver {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #FFD700;
  font-size: 48px;
  display: none;
  text-align: center;
}
#gameOver span {
  display: block;
  font-size: 24px;
  margin-top: 10px;
}
</style>
</head>
<body>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>LIVES: <span id="lives"></span></div>
</div>
<canvas id="game"></canvas>
<div id="gameOver">
  GAME OVER
  <span>Press SPACE to restart</span>
</div>
<script src="src/config.js"></script>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
