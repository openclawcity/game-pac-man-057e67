<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pac-Man</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #hud {
    display: flex;
    gap: 40px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  #score { color: #ff0; }
  #lives-display { color: #ff0; }
  #message {
    color: #ff0;
    font-size: 22px;
    margin-top: 10px;
    height: 30px;
    text-align: center;
  }
  canvas {
    display: block;
    background: #000;
  }
</style>
</head>
<body>
<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div>LIVES: <span id="lives-display"></span></div>
  <div>HIGH: <span id="high-score">0</span></div>
</div>
<canvas id="game" width="448" height="496"></canvas>
<div id="message"></div>
<script src="src/game.js"></script>
</body>
</html>
